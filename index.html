<!DOCTYPE html><html lang="rw" translate="no"><meta name="google" content="notranslate"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrueBallers – Basketball</title><link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff6a00;--k:#111;--b:#e6e6e6}*{box-sizing:border-box}
body{margin:0;font:16px/1.6 Raleway,system-ui,sans-serif;color:var(--k);background:#fff}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.w{max-width:1180px;margin:auto;padding:0 16px}.bar{background:var(--k);color:#ccc;font-size:13px}.bar .w{display:flex;justify-content:space-between;align-items:center;padding:6px 16px}
.lg{display:flex;gap:4px}.lg button{background:none;color:#ccc;padding:2px 11px;font-size:13px;border-radius:4px}.lg button.on{background:var(--o);color:#fff}
button{background:var(--o);color:#fff;border:0;cursor:pointer;font:inherit;font-weight:700;padding:9px 18px;border-radius:4px}
input,textarea{font:inherit;padding:10px 14px;border:1px solid var(--b);border-radius:4px;width:100%;margin-bottom:8px}
.top{display:flex;align-items:center;gap:14px;padding:14px 16px}.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:30px}.logo img{height:68px;width:68px;border-radius:50%}.logo b{color:var(--o)}.sp{flex:1}
.top form{display:flex;border:1px solid var(--b);border-radius:4px;overflow:hidden}.top input{border:0;margin:0;width:200px;outline:0;border-radius:0}.top form button{border-radius:0}
nav{background:#fff;border-top:1px solid var(--b);border-bottom:3px solid var(--o);position:sticky;top:0;z-index:9}nav .w{display:flex;overflow-x:auto}
nav a{padding:13px 18px;white-space:nowrap;font-weight:700}nav a:hover{color:var(--o)}nav a.on{background:var(--o);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 0;max-width:1180px;margin:auto}.chips a{padding:4px 16px;border:1px solid var(--o);border-radius:30px;white-space:nowrap;font-size:14px;font-weight:600}.chips a.on{background:var(--o);color:#fff}
.tick{background:#f5f5f5;font-size:13px;border-bottom:1px solid var(--b)}.tick .w{display:flex;gap:12px;overflow-x:auto;padding:7px 16px;align-items:center}.tick em{color:var(--o);font-style:normal;font-weight:800}.tick span{white-space:nowrap}
main{display:grid;grid-template-columns:1fr 300px;gap:34px;margin:26px auto}@media(max-width:900px){main{grid-template-columns:1fr}.hero{grid-template-columns:1fr!important}}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:28px;margin-bottom:10px}
.im,.ph{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee}.ph{background:linear-gradient(135deg,#111,var(--o));color:#fff;display:grid;place-items:center;font-size:34px;font-weight:800}
.lead h2{font-size:28px;line-height:1.25;margin:10px 0}.mt{color:#888;font-size:14px}.cat{color:var(--o);font-weight:700}.tag{color:var(--o);font-weight:700}
.tl{border-left:3px solid var(--o);padding-left:20px}.ti{display:block;position:relative;padding:0 0 14px;margin-bottom:14px;border-bottom:1px solid var(--b)}.ti:before{content:"";position:absolute;left:-30px;top:5px;width:12px;height:12px;background:#fff;border:3px solid var(--o);border-radius:50%}
.ti h3{margin:2px 0 0;font-size:16px;line-height:1.35}.lead:hover h2,.ti:hover h3,.card:hover h3{color:var(--o)}
.h{font-size:20px;margin:34px 0 16px;padding-bottom:6px;border-bottom:3px solid var(--b);position:relative}.h:after{content:"";position:absolute;left:0;bottom:-3px;width:70px;height:3px;background:var(--o)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}.card{display:block}.card h3{margin:4px 0;font-size:16px;line-height:1.35}
aside .bx{border:1px solid var(--b);padding:18px;margin-bottom:22px}aside .h{margin-top:0}
.tr{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--b);font-weight:600;font-size:15px}.tr b{color:var(--o);font-size:24px;line-height:1}
.yt{background:var(--o);color:#fff;text-align:center;border:0!important}.yt a{display:inline-block;background:#fff;color:var(--o);padding:8px 18px;border-radius:4px;font-weight:700;margin-top:6px}
.art h1{font-size:34px;line-height:1.2;margin:8px 0 14px}.art p{white-space:pre-line;font-size:18px}.mi{width:100%;max-height:520px;object-fit:cover}.th{display:flex;gap:8px;margin:8px 0 16px;overflow-x:auto}.th img{height:70px;width:100px;object-fit:cover;cursor:pointer}
iframe{width:100%;aspect-ratio:16/9;border:0;margin-bottom:12px}.sh{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;align-items:center}.sh a,.sh button{background:var(--k);color:#fff;padding:7px 16px;border-radius:4px;font-size:14px;font-weight:700}
.cm{background:#f5f5f5;padding:10px 14px;margin-bottom:8px}.note{background:#fff3e8;border-left:4px solid var(--o);padding:10px 14px;margin-bottom:14px}small{color:#888}
footer{background:var(--k);color:#bbb;padding:34px 0 20px;margin-top:30px}footer .w{display:flex;gap:30px;flex-wrap:wrap;justify-content:space-between}footer a{color:var(--o)}
</style></head><body>
<div class="bar"><div class="w"><span id="today"></span><div class="lg"><button id="l-rw" onclick="setLang('rw')">RW</button><button id="l-en" onclick="setLang('en')">EN</button><button id="l-fr" onclick="setLang('fr')">FR</button></div></div></div>
<header><div class="w top"><a class="logo" href="#/"><img src="logo.png" alt="">True<b>Ballers</b></a><div class="sp"></div>
<form onsubmit="location.hash='#/q/'+encodeURIComponent(this.q.value);return false"><input name="q" data-p="search"><button>🔍</button></form></div></header>
<nav><div class="w" id="nav"></div></nav><div class="chips" id="chips"></div><div class="tick"><div class="w"><em data-i="scores"></em><div id="tick" style="display:flex;gap:16px"></div></div></div>
<main class="w"><div id="main"></div><aside><div class="bx"><h2 class="h" data-i="trending"></h2><div id="trend"></div></div>
<div class="bx"><h2 class="h">✉️</h2><p data-i="nl" style="margin-top:0"></p><form onsubmit="sub(event)"><input name="e" type="email" required placeholder="Email"><button style="width:100%" data-i="nlb"></button></form><small id="sm"></small></div>
<div class="bx yt"><h3 style="margin:0">▶️ YouTube</h3><a href="https://www.youtube.com/@trueballers26true-s8f" target="_blank" data-i="follow"></a></div></aside></main>
<footer><div class="w"><div><b style="color:#fff;font-size:20px">True<span style="color:var(--o)">Ballers</span></b><br>Basketball contents</div><div>📞 +250 788 569 147<br>✉️ moseyhabu@yahoo.com<br>▶️ <a href="https://www.youtube.com/@trueballers26true-s8f" target="_blank">YouTube</a></div><div>© TrueBallers</div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script>
<script>
const sb=supabase.createClient(CFG.URL,CFG.KEY),$=s=>document.querySelector(s);let lang=localStorage.getItem('tb_lang')||'rw';
const TX={rw:{home:'Ahabanza',rwanda:"Basketball y'u Rwanda",intl:'Mpuzamahanga',videos:'Amashusho',opinion:'Ibitekerezo',contact:'Twandikire',search:'Shakisha…',trending:'Izisomwa cyane',latest:'Amakuru mashya',nl:'Menya amakuru mashya kuri email',nlb:'Iyandikishe',thanks:'Murakoze! ✔',err:'Waramaze kwiyandikisha cyangwa habaye ikibazo',cm:'Ibitekerezo',name:'Izina ryawe',write:'Andika igitekerezo cyawe',send:'Ohereza',none:'Nta nkuru zihari.',other:'Nta nkuru ziri muri uru rurimi ubu. Dore izindi.',share:'Sangiza',copy:'Kopera link',follow:'Dukurikire kuri YouTube',scores:'Amanota'},
en:{home:'Home',rwanda:'Rwanda Basketball',intl:'International',videos:'Videos',opinion:'Opinion',contact:'Contact',search:'Search…',trending:'Trending',latest:'Latest news',nl:'Get the latest news by email',nlb:'Subscribe',thanks:'Thank you! ✔',err:'Already subscribed or an error occurred',cm:'Comments',name:'Your name',write:'Write a comment',send:'Send',none:'No articles yet.',other:'No articles in this language yet. Here are others.',share:'Share',copy:'Copy link',follow:'Follow us on YouTube',scores:'Scores'},
fr:{home:'Accueil',rwanda:'Basketball rwandais',intl:'International',videos:'Vidéos',opinion:'Opinion',contact:'Contact',search:'Rechercher…',trending:'Les plus lus',latest:'Dernières actualités',nl:'Recevez les actualités par e-mail',nlb:"S'abonner",thanks:'Merci ! ✔',err:'Déjà abonné ou une erreur est survenue',cm:'Commentaires',name:'Votre nom',write:'Écrire un commentaire',send:'Envoyer',none:'Aucun article pour le moment.',other:"Pas encore d'articles dans cette langue. En voici d'autres.",share:'Partager',copy:'Copier le lien',follow:'Suivez-nous sur YouTube',scores:'Scores'}};
const t=k=>TX[lang][k],SEC={rwanda:['BAL','Rwanda Basketball League','Patriots','REG','APR',"Women's League"],intl:['NBA','FIBA','EuroLeague']};
const NAV=[['home','/'],['rwanda','/s/rwanda'],['intl','/s/intl'],['videos','/c/Videos'],['opinion','/c/Opinion'],['contact','/contact']];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=a=>{const m=Math.max(1,Math.round((Date.now()-new Date(a.created_at))/6e4)),h=Math.round(m/60),d=Math.round(h/24),L={rw:['Iminota '+m+' irashize','Amasaha '+h+' ashize','Iminsi '+d+' ishize'],en:[m+' min ago',h+' h ago',d+' d ago'],fr:['Il y a '+m+' min','Il y a '+h+' h','Il y a '+d+' j']}[lang];return m<60?L[0]:h<24?L[1]:d<7?L[2]:dt(a)};
const cover=a=>(a.images&&a.images[0])||a.image_url,PH="this.outerHTML='<div class=ph>TB</div>'";
const pic=a=>cover(a)?`<img class="im" src="${esc(cover(a))}" alt="" loading="lazy" onerror="${PH}">`:'<div class="ph">TB</div>';
const dt=a=>new Date(a.created_at).toLocaleDateString(lang);
const card=a=>`<a class="card" href="#/a/${a.id}">${pic(a)}<div class="mt"><span class="cat">${esc(a.category)}</span> · ${ago(a)}</div><h3>${esc(a.title)}</h3></a>`;
const lead=a=>`<a class="lead" href="#/a/${a.id}">${pic(a)}<div class="mt" style="margin-top:8px">${ago(a)} · <span class="cat">${esc(a.category)}</span></div><h2>${esc(a.title)}</h2><small>${esc(a.summary)}</small></a>`;
const tli=a=>`<a class="ti" href="#/a/${a.id}"><div class="mt">${ago(a)} · <span class="cat">${esc(a.category)}</span></div><h3>${esc(a.title)}</h3></a>`;
const blk=(ti,l)=>l.length?`<h2 class="h">${ti}</h2><div class="grid">${l.slice(0,6).map(card).join('')}</div>`:'';
function ui(){document.documentElement.lang=lang;$('#today').textContent=new Date().toLocaleDateString(lang,{weekday:'long',day:'numeric',month:'long',year:'numeric'});document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));
 ['rw','en','fr'].forEach(l=>$('#l-'+l).className=l==lang?'on':'')}
function setLang(l){lang=l;localStorage.setItem('tb_lang',l);ui();route()}
async function feed(f){const b=()=>{let q=sb.from('articles').select('id,title,summary,category,image_url,images,created_at').eq('published',true).order('created_at',{ascending:false}).limit(40);return f?f(q):q};
 let d=(await b().eq('lang',lang)).data||[],fb=0;if(!d.length){d=(await b()).data||[];fb=d.length}return[d,fb]}
async function route(){const[,k,x]=location.hash.split('/').map(decodeURIComponent),v=x||'',m=$('#main');scrollTo(0,0);
 sb.from('page_views').insert({path:location.hash||'#/'}).then(()=>{});
 $('#nav').innerHTML=NAV.map(n=>`<a href="#${n[1]}" class="${(location.hash.slice(1)||'/')==n[1]?'on':''}">${t(n[0])}</a>`).join('');
 const sec=k=='s'?v:SEC.rwanda.includes(v)?'rwanda':SEC.intl.includes(v)?'intl':'';
 $('#chips').innerHTML=sec?SEC[sec].map(c=>`<a href="#/c/${encodeURIComponent(c)}" class="${c==v?'on':''}">${c}</a>`).join(''):'';
 if(k=='a'){const{data:a}=await sb.from('articles').select('*').eq('id',v).single();if(!a){m.innerHTML=t('none');return}
  sb.rpc('add_view',{aid:v});const u=location.href,vid=(a.video_url||'').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/),im=a.images&&a.images.length?a.images:(a.image_url?[a.image_url]:[]);
  const{data:cs}=await sb.from('comments').select('*').eq('article_id',v).order('created_at');
  m.innerHTML=`<div class="art"><span class="tag">${esc(a.category)}</span> <small>${dt(a)} · 👁 ${a.views}</small><h1>${esc(a.title)}</h1>
  ${im.length?`<img id="mi" class="mi" src="${esc(im[0])}" alt="" onerror="${PH}">`:''}${im.length>1?`<div class="th">${im.map(i=>`<img src="${esc(i)}" alt="" onclick="document.getElementById('mi').src=this.src">`).join('')}</div>`:''}
  ${vid?`<iframe src="https://www.youtube.com/embed/${vid[1]}" allowfullscreen></iframe>`:''}<p>${esc(a.body)}</p><small>${esc(a.tags)}</small>
  <div class="sh"><b>${t('share')}:</b><a target="_blank" href="https://wa.me/?text=${encodeURIComponent(a.title+' '+u)}">WhatsApp</a><a target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(u)}">Facebook</a><a target="_blank" href="https://twitter.com/intent/tweet?url=${encodeURIComponent(u)}&text=${encodeURIComponent(a.title)}">X</a><button onclick="navigator.clipboard.writeText(location.href)">${t('copy')}</button></div>
  <h2 class="h">${t('cm')} (${cs.length})</h2>${cs.map(c=>`<div class="cm"><b>${esc(c.name)}</b><br>${esc(c.body)}</div>`).join('')}
  <form onsubmit="cmt(event,'${a.id}')"><input name="n" required placeholder="${t('name')}"><textarea name="b" required rows="3" placeholder="${t('write')}"></textarea><button>${t('send')}</button></form></div>`;return}
 if(k=='contact'){m.innerHTML=`<div class="art"><h1>${t('contact')}</h1><p>📞 <a href="tel:+250788569147">+250 788 569 147</a>\n✉️ <a href="mailto:moseyhabu@yahoo.com">moseyhabu@yahoo.com</a>\n▶️ <a href="https://www.youtube.com/@trueballers26true-s8f" target="_blank">YouTube: @trueballers26true</a></p></div>`;return}
 let f=null,h='';
 if(k=='c'){f=q=>q.eq('category',v);h=v}else if(k=='s'){f=q=>q.in('category',SEC[v]);h=t(v)}else if(k=='q'){f=q=>q.or(`title.ilike.%${v}%,summary.ilike.%${v}%,tags.ilike.%${v}%`);h='“'+v+'”'}
 const[d,fb]=await feed(f),note=fb?`<div class="note">${t('other')}</div>`:'';
 if(!d.length){m.innerHTML=`<div class="note">${t('none')}</div>`;return}
 if(h){m.innerHTML=`<h2 class="h" style="margin-top:0">${esc(h)}</h2>${note}<div class="grid">${d.map(card).join('')}</div>`;return}
 m.innerHTML=note+`<div class="hero">${lead(d[0])}<div class="tl">${d.slice(1,7).map(tli).join('')}</div></div>`
  +blk(t('rwanda'),d.filter(a=>SEC.rwanda.includes(a.category)))+blk(t('intl'),d.filter(a=>SEC.intl.includes(a.category)))+blk(t('videos'),d.filter(a=>a.category=='Videos'))+blk(t('opinion'),d.filter(a=>a.category=='Opinion'))}
async function side(){const{data:x}=await sb.from('articles').select('id,title').eq('published',true).order('views',{ascending:false}).limit(5);
 $('#trend').innerHTML=(x||[]).map((a,i)=>`<a class="tr" href="#/a/${a.id}"><b>${i+1}</b><span>${esc(a.title)}</span></a>`).join('');
 const{data:s}=await sb.from('scores').select('*').order('created_at',{ascending:false}).limit(8);
 $('#tick').innerHTML=(s||[]).map(x=>`<span><b>${esc(x.league)}</b> ${esc(x.home)} <em>${x.hs}–${x.as}</em> ${esc(x.away)} · ${esc(x.status)}</span>`).join('')}
async function cmt(e,id){e.preventDefault();await sb.from('comments').insert({article_id:id,name:e.target.n.value,body:e.target.b.value});route()}
async function sub(e){e.preventDefault();const r=await sb.from('subscribers').insert({email:e.target.e.value});$('#sm').textContent=r.error?t('err'):t('thanks');e.target.reset()}
addEventListener('hashchange',route);ui();route();side();
</script></body></html>
